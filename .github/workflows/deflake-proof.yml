name: deflake proof (temporary, remove before merge)
on:
  push:
    branches: [test/deflake]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      # the SQL storage, replica, permission and audit suites run against real databases (they skip without these)
      PW_TEST_PG: postgres://postgres:pw-test@127.0.0.1:5432/postgres
      PW_TEST_MYSQL: mysql://root:pw-test@127.0.0.1:3306/pwtest
      PW_TEST_MSSQL: mssql://sa:Pw-test-1234@127.0.0.1:1433/master?encrypt=false
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw-test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: pw-test, MYSQL_DATABASE: pwtest }
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw-test" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: Pw-test-1234 }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Pw-test-1234 -Q 'SELECT 1' || exit 1" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: gov-blobs x20
        run: for i in $(seq 1 20); do npx vitest run tests/engine/gov-blobs.test.js || exit 1; done
      - name: queue x20
        run: for i in $(seq 1 20); do npx vitest run tests/engine/queue.test.js || exit 1; done
      - name: storage x20 (real Postgres, MySQL, SQL Server)
        run: for i in $(seq 1 20); do npx vitest run --no-file-parallelism tests/engine/storage.test.js || exit 1; done
