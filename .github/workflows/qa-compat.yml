# QA suite: compat (docs/QA.md). The packed npm packages installed into a fresh app on every OS x Node, a PDF and an
# xlsx rendered there; Vite, webpack and Next.js builds of an app using the viewer; Chromium, Firefox and WebKit open the
# viewer and export a PDF. tier quick: Node 22 only; full (and push): Node 20, 22, 24.
name: qa-compat
on:
  workflow_call:
    inputs:
      ref: { type: string, default: '' }
      tier: { type: string, default: quick }
  workflow_dispatch:
    inputs:
      ref: { type: string, default: '' }
      tier: { type: string, default: quick }
  push:
    branches: [qa/core]

jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ${{ fromJSON(inputs.tier == 'quick' && '[22]' || '[20, 22, 24]') }}
    env:
      QA_SHARD: install-${{ matrix.os }}-${{ matrix.node }}
      QA_BASH: ${{ startsWith(matrix.os, 'windows') && 'C:\Program Files\Git\bin\bash.exe' || 'bash' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm } # builds the packages with the repo's Node; the app below uses matrix.node
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - name: pack engine, fonts, cli
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          npm pack ./packages/engine ./packages/fonts ./packages/cli --pack-destination "$RUNNER_TEMP/pkgs" --silent
          node packages/create-reportwright/src/bin.mjs "$RUNNER_TEMP/app" --template node --yes
          cp examples/report.pw.json "$RUNNER_TEMP/app/qa.pw.json"
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - name: install into a fresh app, render PDF + xlsx
        env: { OSN: '${{ matrix.os }} node ${{ matrix.node }}' }
        run: |
          P="$RUNNER_TEMP/pkgs"; A="$RUNNER_TEMP/app"
          node scripts/qa.mjs check compat "install ($OSN)" "npm i of the packed tarballs succeeds" "cd '$A' && npm i --no-audit --no-fund '$P'/reportwright-engine-*.tgz '$P'/reportwright-fonts-*.tgz '$P'/reportwright-cli-*.tgz 2>&1 | tail -3"
          node scripts/qa.mjs check compat "engine renders PDF ($OSN)" "npm start writes orders.pdf (%PDF-)" "cd '$A' && npm start && head -c 5 orders.pdf | grep -q '%PDF-'"
          node scripts/qa.mjs check compat "cli renders PDF ($OSN)" "npx pw render -f pdf (%PDF-)" "cd '$A' && npx pw render qa.pw.json -f pdf -o qa.pdf && head -c 5 qa.pdf | grep -q '%PDF-'"
          node scripts/qa.mjs check compat "cli renders xlsx ($OSN)" "npx pw render -f xlsx (a zip, PK)" "cd '$A' && npx pw render qa.pw.json -f xlsx -o qa.xlsx && head -c 2 qa.xlsx | grep -q PK"
      - if: always()
        run: node scripts/qa.mjs summarize compat
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'qa-compat-part-install-${{ matrix.os }}-${{ matrix.node }}', path: qa-out/*.jsonl, if-no-files-found: ignore }

  bundlers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_SHARD: bundlers
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages && npx playwright install --with-deps chromium
      - run: node scripts/qa.mjs check compat "Vite build (tests/e2e/vite-build.mjs)" "a Vite app with @reportwright/viewer builds and renders" "node tests/e2e/vite-build.mjs"
      - run: node scripts/qa.mjs check compat "React wrapper (tests/e2e/react-wrapper.mjs)" "@reportwright/react mounts viewer + designer" "node tests/e2e/react-wrapper.mjs"
      - name: webpack and Next.js builds of an app importing @reportwright/viewer (the packed tarball)
        run: |
          T="$RUNNER_TEMP/b"; mkdir -p "$T"
          npm pack ./packages/viewer ./packages/react --pack-destination "$T" --silent
          # webpack
          mkdir -p "$T/wp/src" && cd "$T/wp"
          echo '{"name":"wp","private":true}' > package.json
          echo "import { mountViewer } from '@reportwright/viewer'; window.mountViewer = mountViewer;" > src/index.js
          cd "$GITHUB_WORKSPACE"
          node scripts/qa.mjs check compat "webpack build" "webpack 5 bundles @reportwright/viewer" "cd '$T/wp' && npm i --no-audit --no-fund webpack@5 webpack-cli@5 '$T'/reportwright-viewer-*.tgz 2>&1 | tail -2 && npx webpack --mode production 2>&1 | tail -15 && ls dist"
          # Next.js (app router, client component)
          mkdir -p "$T/nx/app" && cd "$T/nx"
          echo '{"name":"nx","private":true,"scripts":{"build":"next build"}}' > package.json
          printf '%s\n' 'export default function Layout({ children }) { return <html><body>{children}</body></html>; }' > app/layout.js
          printf '%s\n' "'use client';" "import { ReportWrightViewer } from '@reportwright/react';" \
            "const def = { \$schema: 'reportwright/report@1', name: 'N', sections: { body: { items: [{ type: 'textbox', name: 'T', x: 0, y: 0, w: 200, h: 18, value: 'Hi' }] } } };" \
            "export default function Page() { return <ReportWrightViewer definition={def} fontsUrl=\"/pw-fonts/\" style={{ height: 300 }} />; }" > app/page.js
          cd "$GITHUB_WORKSPACE"
          node scripts/qa.mjs check compat "Next.js build" "next build of a page with @reportwright/react" "cd '$T/nx' && npm i --no-audit --no-fund next@16 react@19 react-dom@19 '$T'/reportwright-viewer-*.tgz '$T'/reportwright-react-*.tgz 2>&1 | tail -2 && npx next build 2>&1 | tail -20"
      - if: always()
        run: node scripts/qa.mjs summarize compat
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-compat-part-bundlers, path: qa-out/*.jsonl, if-no-files-found: ignore }

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TZ: Asia/Kolkata
      QA_SHARD: browser-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: build and start the server (scripts/restart.sh, as ci.yml)
        run: |
          ./scripts/restart.sh
          for i in $(seq 1 90); do curl -sf http://localhost:3000/api/v1/livez && break; sleep 1; done
      - env: { BROWSERS: '${{ matrix.browser }}' }
        run: |
          node scripts/qa.mjs check compat "$BROWSERS: viewer + PDF export + designer" "tests/e2e/browsers.mjs ok" "node tests/e2e/browsers.mjs"
      - if: matrix.browser == 'chromium'
        run: |
          node scripts/qa.mjs check compat "chromium: standalone viewer, no server (tests/e2e/standalone-viewer.mjs)" "renders, no /api, no 404" "node scripts/build-packages.mjs >/dev/null && node tests/e2e/standalone-viewer.mjs"
      - if: always()
        run: node scripts/qa.mjs summarize compat
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'qa-compat-part-browser-${{ matrix.browser }}', path: qa-out/*.jsonl, if-no-files-found: ignore }

  results:
    needs: [install, bundlers, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}', sparse-checkout: scripts }
      - uses: actions/download-artifact@v4
        with: { pattern: qa-compat-part-*, path: parts, merge-multiple: true }
      - run: node scripts/qa.mjs summarize compat parts
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-compat-results, path: "qa-out/results.json\nqa-out/summary.md" }
