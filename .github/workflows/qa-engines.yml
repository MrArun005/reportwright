# QA suite engines: wraps the deep benchmark (bench-deep-run.yml, groups: create-engines bulk) and grades it into the QA contract
# (qa/rival-best/lib/grade_bench.py has the PASS/WARN/FAIL rule). A loss is a result, never tuned away.
name: qa-engines
on:
  workflow_call:
    inputs:
      ref: {type: string, default: ""}
      tier: {type: string, default: quick}
      engine_ref: {type: string, default: "", description: "git ref of this repo to build the engine from; empty = ref, then npm"}
  workflow_dispatch:
    inputs:
      ref: {type: string, default: "", description: "git ref of this repo (engine) to test; empty = npm"}
      tier: {type: choice, options: [quick, full], default: quick}
      engine_ref: {type: string, default: "", description: "git ref to build the engine from; empty = ref, then npm"}
  push:
    branches: [qa/bench]
permissions:
  contents: read
  actions: read
jobs:
  bench:
    uses: ./.github/workflows/bench-deep-run.yml
    with:
      tier: ${{ inputs.tier || 'quick' }}
      groups: "create-engines bulk"
      engine_ref: ${{ inputs.engine_ref || inputs.ref }}
      prefix: qa-engines-
      control: qa/rival-best/push-tier
      workflow: qa-engines.yml
      title: "QA: report engines"
    secrets: inherit
  grade:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: qa-engines-bench-deep-results
          path: bench-out
      - name: Grade
        run: python3 qa/rival-best/lib/grade_bench.py bench-out/results.json engines engines out --expect JasperReports "JasperReports did not start" --expect BIRT "BIRT did not start (bench-add-engines work, unfinished)" --expect FastReport "FastReport did not start (bench-add-engines work)" --expect SSRS "SSRS needs the windows-latest job; it produced no comparable result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qa-engines-results
          path: out/
