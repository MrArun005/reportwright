# QA suite: conformance (docs/QA.md). veraPDF on PDF/A-2b, PDF/A-2a and PDF/UA-1 of every repository report; Factur-X
# XSD; signatures verified by pdfsig and pyHanko; encrypted files open with their password in qpdf.
name: qa-conformance
on:
  workflow_call:
    inputs:
      ref: { type: string, default: '' }
      tier: { type: string, default: quick }
  workflow_dispatch:
    inputs:
      ref: { type: string, default: '' }
      tier: { type: string, default: quick }
  push:
    branches: [qa/core]

env:
  TZ: Asia/Kolkata

jobs:
  verapdf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavour: [2b, 2a, ua1]
    env:
      QA_SHARD: vera-${{ matrix.flavour }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: veraPDF CLI image as a command (as ci.yml)
        run: |
          docker pull -q verapdf/cli:latest
          printf '#!/bin/sh\nexec docker run --rm -u "$(id -u):$(id -g)" -v /tmp:/tmp verapdf/cli:latest "$@"\n' | sudo tee /usr/local/bin/verapdf >/dev/null && sudo chmod +x /usr/local/bin/verapdf
      - name: every report, ${{ matrix.flavour }}
        env: { FLAVOUR: '${{ matrix.flavour }}' }
        run: |
          node scripts/qa.mjs sample-server 3999 &
          sleep 2
          case $FLAVOUR in 2b) flags=--pdfa;; 2a) flags='--pdfa --ua';; ua1) flags=--ua;; esac
          mkdir -p /tmp/vera
          for r in reports/*.pw.json; do
            id=$(basename "$r" .pw.json); f=/tmp/vera/$id-$FLAVOUR.pdf
            node scripts/qa.mjs check conformance "veraPDF $FLAVOUR $id" "isCompliant=true" \
              "node bin/pw.mjs render $r -f pdf $flags -o $f --base http://127.0.0.1:3999 --allow-internal && { verapdf --flavour $FLAVOUR --format xml $f > $f.xml || true; } && grep -q 'isCompliant=\"true\"' $f.xml || { grep -o 'clause=\"[^\"]*\"[^>]*status=\"failed\"' $f.xml | head -5; exit 1; }"
          done
      - if: always()
        run: node scripts/qa.mjs summarize conformance
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'qa-conformance-part-vera-${{ matrix.flavour }}', path: qa-out/*.jsonl, if-no-files-found: ignore }

  sign-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_SHARD: sign
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/qa-conformance.yml }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf && pip install -q 'pyhanko[opentype]' pyhanko-cli factur-x
      - name: a signed PDF (throwaway self-signed .p12 through src/server/sign.js)
        run: |
          mkdir -p /tmp/sig && cd /tmp/sig
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 -subj /CN=ReportWright-QA 2>/dev/null
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out signer.p12 -passout pass:qa -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/sig/sign.mjs <<'JS'
          import fs from 'node:fs';
          const { renderTo } = await import(process.cwd() + '/src/server/renderer.js');
          const def = { $schema: 'reportwright/report@1', name: 'Signed', page: { size: 'A4', margins: [36, 36, 36, 36] },
            sections: { body: { items: [{ type: 'textbox', name: 'T', x: 0, y: 0, w: 300, h: 18, value: 'Signed by QA' }] } } };
          const r = await renderTo(def, { format: 'pdf', sign: true, pdfa: true, baseUrl: 'http://127.0.0.1:3000' });
          fs.writeFileSync('/tmp/sig/signed.pdf', r.bytes);
          JS
          node scripts/qa.mjs check conformance "sign a PDF" "renderTo(sign: true) writes a signed PDF" "PW_SIGN_P12=/tmp/sig/signer.p12 PW_SIGN_PASSWORD=qa node /tmp/sig/sign.mjs && ls -l /tmp/sig/signed.pdf"
          node scripts/qa.mjs check conformance "pdfsig verifies the signature" "Signature is Valid" "pdfsig -nocert /tmp/sig/signed.pdf | tee /dev/stderr | grep -q 'Signature Validation: Signature is Valid'"
          node scripts/qa.mjs check conformance "pyHanko validates the signature" "INTACT, trusted with the signer's cert" "pyhanko sign validate --pretty-print --trust /tmp/sig/cert.pem /tmp/sig/signed.pdf"
      - name: encrypted PDFs
        run: |
          node scripts/qa.mjs sample-server 3999 &
          sleep 2
          for r in invoice-gallery loan-statement; do
            node scripts/qa.mjs check conformance "encrypted $r opens with its password" "qpdf --check passes with the password" "node bin/pw.mjs render reports/$r.pw.json -f pdf --password s3cret --owner-password own3r -o /tmp/$r-enc.pdf --base http://127.0.0.1:3999 --allow-internal && qpdf --password=s3cret --check /tmp/$r-enc.pdf | tail -2"
            node scripts/qa.mjs check conformance "encrypted $r needs a password" "qpdf --requires-password exits 0" "qpdf --requires-password /tmp/$r-enc.pdf"
          done
      - name: Factur-X
        run: |
          if grep -rqil 'factur\|zugferd' src packages/*/README.md examples 2>/dev/null; then
            node scripts/qa.mjs check conformance "Factur-X XSD" "factur-x validates the embedded XML" "echo 'TODO: point at the library example' && exit 1"
          else
            node scripts/qa.mjs skip conformance "Factur-X XSD" "no Factur-X output or example in this ref (grep src, packages, examples)"
          fi
      - if: always()
        run: node scripts/qa.mjs summarize conformance
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-conformance-part-sign, path: qa-out/*.jsonl, if-no-files-found: ignore }

  results:
    needs: [verapdf, sign-encrypt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}', sparse-checkout: scripts }
      - uses: actions/download-artifact@v4
        with: { pattern: qa-conformance-part-*, path: parts, merge-multiple: true }
      - run: node scripts/qa.mjs summarize conformance parts
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-conformance-results, path: "qa-out/results.json\nqa-out/summary.md" }
