name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      # the SQL storage, replica, permission and audit suites run against real databases (they skip without these)
      PW_TEST_PG: postgres://postgres:pw-test@127.0.0.1:5432/postgres
      PW_TEST_MYSQL: mysql://root:pw-test@127.0.0.1:3306/pwtest
      PW_TEST_MSSQL: mssql://sa:Pw-test-1234@127.0.0.1:1433/master?encrypt=false
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw-test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: pw-test, MYSQL_DATABASE: pwtest }
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw-test" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: Pw-test-1234 }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Pw-test-1234 -Q 'SELECT 1' || exit 1" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils # pdftotext: the PDF text, password and script tests read the PDFs they make
      - name: Type check (the server has no errors; the engine's may only go down)
        run: npm run typecheck
      # storage, perms and audit share the one database per engine (storage.test.js empties its tables between cases),
      # so they run one file at a time after the rest; in one parallel run they wipe each other's jobs and leases
      - run: npx vitest run --exclude tests/engine/storage.test.js --exclude tests/engine/perms.test.js --exclude tests/engine/audit.test.js
      - run: npx vitest run --no-file-parallelism tests/engine/storage.test.js tests/engine/perms.test.js tests/engine/audit.test.js
      - run: node scripts/check-engine-boundary.mjs
      - name: Report snapshots (fails when a page or a total changes)
        run: node bin/pw.mjs test reports
      - name: npm packages, Socket-style scan (install scripts, eval, child_process, long lines, pinned deps, metadata)
        run: npm run build:packages && npm run scan:packages
      - run: npm run build

  verapdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: veraPDF (the CLI image) as a command
        run: |
          docker pull verapdf/cli:latest
          # run as the runner's uid: the script's mkdtemp dir is 0700, which the image's own user can't read ("doesn't exist")
          printf '#!/bin/sh\nexec docker run --rm -u "$(id -u):$(id -g)" -v /tmp:/tmp verapdf/cli:latest "$@"\n' | sudo tee /usr/local/bin/verapdf && sudo chmod +x /usr/local/bin/verapdf
      - name: PDF/A-2b and PDF/UA-1 of the showcase reports
        run: node scripts/verapdf.mjs
        env:
          TMPDIR: /tmp

  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils # pdftotext, pdftoppm: the suites read the PDFs they get
      - run: npm run fonts:cjk # the optional CJK and emoji fonts a developer machine has: the suites expect no 404 for them
      - name: 'Build and start the server as the suites expect (scripts/restart.sh, PW_AUTH=proxy behind scripts/e2e-proxy.mjs, test keys)'
        run: |
          ./scripts/restart.sh
          for i in $(seq 1 90); do curl -sf http://localhost:3000/api/v1/livez && break; sleep 1; done
      - name: Browser suites
        run: npm run test:e2e
      - name: Firefox and WebKit smoke (viewer, PDF export, designer)
        run: npx playwright install --with-deps firefox webkit && node tests/e2e/browsers.mjs
      # suites that start their own servers (accounts, SSO, two replicas): each needs a build, which the step above made
      - name: Suites with their own servers (sso, replicas)
        run: node tests/e2e/sso.mjs && node tests/e2e/replicas.mjs
      - name: Accounts and permissions (a server with PW_AUTH=users, as tests/e2e/users.mjs says)
        run: |
          PW_AUTH=users PW_SESSION_SECRET=$(openssl rand -hex 32) PW_DATA_KEY=$(openssl rand -hex 32) PW_ADMIN_EMAIL=admin@e2e.test PW_ADMIN_PASSWORD='e2e admin password' \
            PW_STORAGE=sqlite:/tmp/pw-e2e-users.db PW_API_KEYS="test-key,viewer@e2e.test|scoped-key" PW_INTERNAL_HOSTS=127.0.0.1 PW_BASE_URL=http://localhost:3602 \
            nohup npx next start -p 3602 > /tmp/next-users.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:3602/api/v1/livez && break; sleep 1; done
          BASE=http://localhost:3602 node tests/e2e/users.mjs && BASE=http://localhost:3602 node tests/e2e/permissions.mjs
      # not run here: drilldown, fonts, viewer-p6 and platform need the sample reports and the embed host page of a
      # developer machine (see each file's header); they are in the manual gate (docs/COORDINATION.md)
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-shots, path: /tmp/shots, if-no-files-found: ignore }
      - name: Server log
        if: failure()
        run: tail -200 /tmp/next.log /tmp/e2e-proxy.log /tmp/next-users.log 2>/dev/null || true
