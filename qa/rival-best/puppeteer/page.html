<!doctype html><html><head><meta charset="utf-8"><style>
@page { size: A4; margin: 0 }
body { margin: 0; font-family: sans-serif; color: #1a1a2e }
header { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: #fff; padding: 48px 40px; border-radius: 0 0 24px 24px }
header h1 { margin: 0; font-size: 34px } header p { margin: 8px 0 0; opacity: .85 }
.grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 32px 40px }
.card { flex: 1 1 calc(33% - 16px); border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.12); background: #fff }
.card h3 { margin: 0 0 6px } .kpi { font-size: 28px; font-weight: 700; color: #2575fc }
.bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #00c9a7, #2575fc) }
</style></head><body>
<header><h1>Quarterly overview</h1><p>Q3 2026, all regions</p></header>
<div class="grid">
<div class="card"><h3>Revenue</h3><div class="kpi">$4.2M</div><div class="bar" style="width:84%"></div></div>
<div class="card"><h3>Customers</h3><div class="kpi">1,284</div><div class="bar" style="width:64%"></div></div>
<div class="card"><h3>Churn</h3><div class="kpi">2.1%</div><div class="bar" style="width:21%"></div></div>
<div class="card"><h3>NPS</h3><div class="kpi">61</div><div class="bar" style="width:61%"></div></div>
<div class="card"><h3>Tickets</h3><div class="kpi">342</div><div class="bar" style="width:34%"></div></div>
<div class="card"><h3>Uptime</h3><div class="kpi">99.98%</div><div class="bar" style="width:99%"></div></div>
</div></body></html>
