# GitHub Action: render every report with its test cases and fail the build when a page changes.
# In your workflow:   - uses: <owner>/reportwright@v1   with: { reports: reports }
name: ReportWright report tests
description: Render each report's test cases with pw test and fail when a page or a total changes.
inputs:
  reports:
    description: Folder with the .pw.json files and a __tests__ folder
    default: reports
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install ReportWright
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}" --omit=optional --no-audit --no-fund
    - name: pw test
      shell: bash
      env:
        TZ: Asia/Kolkata
      run: node "${{ github.action_path }}/bin/pw.mjs" test "${{ inputs.reports }}"
